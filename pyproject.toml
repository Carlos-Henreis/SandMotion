[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sandmotion"
version = "0.6.0"
description = "Image-driven particle explosions for vertical videos"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "Pillow>=10"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
sand-motion = "sandmotion.cli:main"

[tool.setuptools.packages.find]
include = ["sandmotion*"]
